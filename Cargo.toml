[package]
name = "scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Network Scanner Contributors"]
description = "A pure Rust network port scanner with formatted table output"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jvzantvoort/scanner"
keywords = ["network", "scanner", "port", "nmap", "security"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }
console = "0.15"

# Network
ipnetwork = "0.20"
surge-ping = "0.8"
dns-lookup = "2.0"

# Table & Output
tabled = "0.15"
indicatif = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scan_benchmark"
harness = false

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
